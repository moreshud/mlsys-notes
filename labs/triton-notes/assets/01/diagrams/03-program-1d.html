<!doctype html>
<!-- fig-height: 260 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>pid maps to an output tile</title>
<link rel="stylesheet" href="ds.css?v=13">
<script src="ds.js?v=10" defer></script>
<style>
  .stage{display:flex; gap:var(--s6); align-items:flex-start; flex-wrap:wrap;}
  .track{flex:none;}

  .grid1d{
    position:relative; flex:none;

    box-sizing:content-box;
    border:1px solid var(--rule-2); border-radius:3px;
    background:var(--panel); overflow:hidden;
  }
  .cells{
    position:absolute; inset:0;
    background-image:repeating-linear-gradient(to right, var(--grid) 0 1px, transparent 1px var(--cw));
  }
  .pt{
    position:absolute; top:0; bottom:0; z-index:2;
    border:1px solid var(--rule-2); border-radius:2px;
    display:grid; place-items:center; cursor:pointer; background:transparent;
    font-family:var(--mono); font-size:11.5px; color:var(--ink-3);
    font-variant-numeric:tabular-nums;
    transition:border-color .2s var(--ease), color .2s var(--ease);
  }
  .pt:hover{border-color:var(--accent); color:var(--accent-ink);}
  .pt.on{
    border-color:var(--accent); border-width:1.5px; background:var(--accent-wash-2);
    color:var(--accent-ink); font-weight:600;
  }

  .axis .ax{color:var(--accent-ink); font-weight:600;}

  .keys{display:flex; gap:var(--s5); flex-wrap:wrap; margin-top:var(--s4);}
  .key{
    display:flex; align-items:center; gap:var(--s2);
    font-family:var(--mono); font-size:11.5px; color:var(--ink-2);
    padding:5px var(--s3); border-radius:3px;
    border:1px solid var(--rule); background:var(--inset);
  }
  .key .dot{width:9px; height:9px; border-radius:2px; flex:none; background:var(--accent);}

  .fig{max-width:856px;}
  .side{flex:0 1 300px; min-width:260px;}
</style>
</head>
<body>
<div class="fig">
  <div class="fig-head">
    <div class="fig-label">pid &rarr; output tile</div>
    <div class="ctl-row">
      <div class="ctl">
        <span class="k">BN</span>
        <div class="seg hint" id="segN">
          <button data-v="2">2</button><button data-v="4">4</button><button data-v="8">8</button>
        </div>
      </div>
      <button class="ghost" id="play" aria-label="Pause"><svg viewBox="0 0 10 10" id="icon"></svg></button>
    </div>
  </div>

  <div class="stage">
    <div class="track">
      <div class="grid1d" id="grid1d">
        <div class="cells" id="cells"></div>
      </div>
      <div class="axis">
        <span>C[0]</span>
        <span class="ax">axis 0 &rarr;</span>
        <span id="axR"></span>
      </div>
      <div class="keys">
        <span class="key"><span class="dot"></span>pid = tl.program_id(0)</span>
      </div>
    </div>
    <div class="side"><div class="read" id="read"></div></div>
  </div>
</div>

<script>
(function(){
  var N=16, CS=24, H=64;
  var state={ blockN:4, pid:0, playing:true, timer:null, pts:[] };

  var grid1d=document.getElementById('grid1d'), cells=document.getElementById('cells'),
      read=document.getElementById('read'), segN=document.getElementById('segN'),
      play=document.getElementById('play'), icon=document.getElementById('icon'),
      axR=document.getElementById('axR');

  var PLAY='<path d="M2 0.5v9l7-4.5z"/>', PAUSE='<rect x="1" y="0.5" width="2.6" height="9"/><rect x="6.4" y="0.5" width="2.6" height="9"/>';

  function cdiv(a,b){ return Math.floor((a+b-1)/b); }
  function gn(){ return cdiv(N,state.blockN); }

  grid1d.style.width=(N*CS)+'px';
  grid1d.style.height=H+'px';
  cells.style.setProperty('--cw',CS+'px');
  axR.textContent='C['+(N-1)+']';

  function build(){
    state.pts.forEach(function(e){ e.remove(); });
    state.pts=[];
    var G=gn(), BN=state.blockN;
    for(var n=0;n<G;n++){
      (function(pid){
        var e=document.createElement('div');
        e.className='pt';
        e.style.left=(pid*BN*CS)+'px';
        e.style.width=(BN*CS)+'px';
        e.textContent=pid;
        e.setAttribute('role','button'); e.setAttribute('tabindex','0');
        e.setAttribute('aria-label','program '+pid);
        e.addEventListener('click', function(){ stop(); state.pid=pid; paint(); });
        e.addEventListener('keydown', function(ev){
          if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); stop(); state.pid=pid; paint(); }
        });
        grid1d.appendChild(e); state.pts.push(e);
      })(n);
    }
  }

  function paint(){
    var G=gn(), BN=state.blockN;
    if(state.pid>=G) state.pid=0;
    var pid=state.pid, lo=pid*BN;

    state.pts.forEach(function(e,i){ e.classList.toggle('on', i===pid); });

    read.innerHTML=
      '<div class="r"><span class="rk">grid</span><span class="rv">('+G+',) &mdash; <em>'+G+'</em> programs</span></div>'+
      '<div class="r"><span class="rk">pid</span><span class="rv">tl.program_id(0) = <em>'+pid+'</em></span></div>'+
      '<div class="r"><span class="rk">tile</span><span class="rv">C['+lo+' : '+(lo+BN)+']</span></div>';
  }

  segN.addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    Array.prototype.forEach.call(segN.querySelectorAll('button'),function(x){x.setAttribute('aria-pressed','false');});
    b.setAttribute('aria-pressed','true');
    state.blockN=parseInt(b.dataset.v,10); state.pid=0;
    build(); paint();
  });
  Array.prototype.forEach.call(segN.querySelectorAll('button'),function(x){
    x.setAttribute('aria-pressed', String(parseInt(x.dataset.v,10)===state.blockN));
  });

  function stop(){ state.playing=false; clearInterval(state.timer); icon.innerHTML=PLAY; play.setAttribute('aria-label','Play'); }
  function start(){
    state.playing=true; icon.innerHTML=PAUSE; play.setAttribute('aria-label','Pause');
    clearInterval(state.timer);
    state.timer=setInterval(function(){ state.pid=(state.pid+1)%gn(); paint(); },1150);
  }
  play.addEventListener('click',function(){ state.playing?stop():start(); });

  build(); paint();
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){ stop(); } else { start(); }
})();
</script>
</body>
</html>
