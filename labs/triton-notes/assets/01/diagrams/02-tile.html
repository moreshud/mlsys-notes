<!doctype html>
<!-- fig-height: 407 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tile vs thread</title>
<link rel="stylesheet" href="ds.css?v=13">
<script src="ds.js?v=10" defer></script>
<style>
  .stage{display:flex; gap:var(--s6); align-items:flex-start; flex-wrap:wrap;}
  .field{flex:1 1 460px; min-width:320px;}

  .mat{
    position:relative;
    display:grid;
    gap:2px;
    padding:2px;
    border:1px solid var(--rule-2);
    border-radius:3px;
    background:var(--panel);
  }
  .u{
    aspect-ratio:1;
    border-radius:2px;
    background:var(--inset);
    border:1px solid transparent;
    transition:background .4s var(--ease), border-color .4s var(--ease), transform .4s var(--ease);
  }

  .u.thread{background:var(--inset); border-color:var(--rule);}
  .u.thread.mine{background:var(--accent-wash-2); border-color:var(--accent);}

  .u.tile{background:var(--inset); border-color:transparent;}
  .u.tile.mine{background:var(--accent-wash-2);}

  .blk{
    position:absolute; pointer-events:none;
    border:1.5px solid var(--ink-3); border-radius:3px;
    opacity:0; transition:opacity .4s var(--ease);
  }
  .blk.show{opacity:.55;}
  .blk.mine{border-color:var(--accent); opacity:1;}

  .side{flex:0 1 250px; min-width:220px;}
</style>
</head>
<body>
<div class="fig">
  <div class="fig-head">
    <div class="fig-label">tile vs thread</div>
    <div class="ctl-row">
      <div class="ctl">
        <span class="k">you write code for</span>
        <div class="seg hint" id="mode">
          <button data-m="thread">one thread</button><button data-m="tile">one tile</button>
        </div>
      </div>
    </div>
  </div>

  <div class="stage">
    <div class="field">
      <div class="mat" id="mat"></div>
      <div class="axis"><span id="axL">8 &times; 16 elements</span><span id="axR"></span></div>
    </div>
    <div class="side">
      <div class="read" id="read"></div>
    </div>
  </div>
</div>

<script>
(function(){
  var M=8, N=16, B=4;
  var state = { mode:'tile', mine:5 };

  var mat=document.getElementById('mat'), read=document.getElementById('read'),
      axR=document.getElementById('axR'),
      seg=document.getElementById('mode');

  mat.style.gridTemplateColumns='repeat('+N+',1fr)';
  var units=[];
  for(var i=0;i<M*N;i++){
    var d=document.createElement('div'); d.className='u'; mat.appendChild(d); units.push(d);
  }

  var tilesPerRow=N/B, tilesPerCol=M/B, blocks=[];
  for(var r=0;r<tilesPerCol;r++){
    for(var c=0;c<tilesPerRow;c++){
      var b=document.createElement('div'); b.className='blk';
      b.style.left = (c/tilesPerRow*100)+'%';
      b.style.top  = (r/tilesPerCol*100)+'%';
      b.style.width  = (100/tilesPerRow)+'%';
      b.style.height = (100/tilesPerCol)+'%';
      b.setAttribute('role','button'); b.setAttribute('tabindex','-1');
      mat.appendChild(b); blocks.push(b);
    }
  }

  function paint(){
    var tileMode = state.mode==='tile';
    var nTiles = tilesPerRow*tilesPerCol;

    for(var i=0;i<M*N;i++){
      var row=Math.floor(i/N), col=i%N;
      var tIdx=Math.floor(row/B)*tilesPerRow + Math.floor(col/B);
      var u=units[i];
      u.className='u '+(tileMode?'tile':'thread');
      if(tileMode ? tIdx===state.mine : i===state.mine) u.classList.add('mine');
    }
    for(var k=0;k<blocks.length;k++){
      blocks[k].classList.toggle('show', tileMode);
      blocks[k].classList.toggle('mine', tileMode && k===state.mine);
      blocks[k].style.pointerEvents = tileMode?'auto':'none';
      blocks[k].setAttribute('tabindex', tileMode?'0':'-1');
    }

    var workers = tileMode ? nTiles : M*N;
    var each    = tileMode ? (B*B) : 1;
    axR.textContent = tileMode ? (nTiles+' tiles of '+B+'×'+B) : (M*N+' threads');

    read.innerHTML =
      '<div class="r"><span class="rk">workers</span><span class="rv"><em>'+workers+'</em></span></div>'+
      '<div class="r"><span class="rk">each owns</span><span class="rv">'+each+' element'+(each>1?'s':'')+'</span></div>'+
      '<div class="r"><span class="rk">you write</span><span class="rv">1 of '+workers+'</span></div>';
  }

  seg.addEventListener('click', function(e){
    var b=e.target.closest('button'); if(!b) return;
    Array.prototype.forEach.call(seg.querySelectorAll('button'),function(x){x.setAttribute('aria-pressed','false');});
    b.setAttribute('aria-pressed','true');
    state.mode=b.dataset.m;
    state.mine = state.mode==='tile' ? 5 : (B*N + B + 1);
    paint();
  });

  blocks.forEach(function(b,k){
    b.addEventListener('click', function(){ if(state.mode==='tile'){ state.mine=k; paint(); } });
    b.addEventListener('keydown', function(e){
      if((e.key==='Enter'||e.key===' ') && state.mode==='tile'){ e.preventDefault(); state.mine=k; paint(); }
    });
  });
  mat.addEventListener('click', function(e){
    if(state.mode!=='thread') return;
    var idx=units.indexOf(e.target); if(idx>=0){ state.mine=idx; paint(); }
  });

  Array.prototype.forEach.call(seg.querySelectorAll('button'),function(x){
    x.setAttribute('aria-pressed', String(x.dataset.m===state.mode));
  });
  paint();
})();
</script>
</body>
</html>
